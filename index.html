<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>friendU - AI Live Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #60a5fa; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

    /* Avatar Core */
    .avatar-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 10%, #6366f1 70%, transparent 100%);
      filter: blur(12px);
      animation: breathe 3.5s ease-in-out infinite alternate;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
    }
    .orb.talking {
      animation: pulse 0.4s ease-in-out infinite alternate;
      background: radial-gradient(circle, #f43f5e 10%, #8b5cf6 70%, transparent 100%);
      box-shadow: 0 0 80px rgba(244, 63, 94, 0.6);
    }
    @keyframes breathe {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.35); }
    }

    .status-text {
      font-size: 15px;
      color: #9ca3af;
      margin-top: 16px;
      text-align: center;
      min-height: 24px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .btn.active {
      background: #ef4444;
      border-color: #f87171;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">friendU</div>
    <div class="badge"><span class="dot"></span> Live Engine</div>
  </header>

  <main>
    <div class="avatar-wrapper">
      <div class="orb" id="visualOrb"></div>
    </div>
    <div class="status-text" id="statusLabel">Listening for you...</div>
  </main>

  <div class="controls">
    <button class="btn" id="micBtn" title="Microphone">🎙️</button>
    <button class="btn" id="camBtn" title="Vision Camera">📷</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
