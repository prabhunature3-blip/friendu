name: Build friendU Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web & Capacitor Setup
        run: |
          mkdir -p build_web
          cp index.html build_web/ || true
          cp -r js css assets *.js *.css build_web/ 2>/dev/null || true

          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.friendu.app",
            "appName": "friendU",
            "webDir": "build_web"
          }
          EOF

          npx cap add android

      - name: Sync Web Files
        run: |
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendU-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
