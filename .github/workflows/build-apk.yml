name: Build friendU Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Web Directory & Capacitor Config
        run: |
          mkdir -p www
          find . -maxdepth 1 -not -name 'www' -not -name '.git' -not -name '.github' -exec cp -r {} www/ \; || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.friendu.app",
            "appName": "friendU",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor & Add Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Copy Assets
        run: |
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendU-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
