name: Build friendU Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web App Structure
        run: |
          mkdir -p public_html
          find . -maxdepth 1 ! -name 'public_html' ! -name '.git' ! -name '.github' -exec cp -rt public_html/ {} +
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat << 'EOF' > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.friendu.app',
            appName: 'friendU',
            webDir: 'public_html'
          };

          export default config;
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendU-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
